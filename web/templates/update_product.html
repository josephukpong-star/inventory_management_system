<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Management System - Update Product</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <aside class="sidebar">

        <div class="sidebar-brand">
            <h2>IMS</h2>
            <p>Inventory System</p>
        </div>

        <nav class="sidebar-nav">

            <a href="/dashboard" class="nav-link">
                Dashboard
            </a>

            <a href="/products" class="nav-link active">
                Products
            </a>

            <a href="/stock" class="nav-link">
                Stock
            </a>

            <a href="/transactions" class="nav-link">
                Transactions
            </a>

            <a href="/reports" class="nav-link">
                Reports
            </a>

            <a href="/backups" class="nav-link">
                Backups
            </a>

        </nav>

        <div class="sidebar-bottom">
            <a href="/logout" class="logout-link">
                Logout
            </a>
        </div>

    </aside>


    <main class="main-content">

        <header class="top-header">

            <div>
                <h1>Update Product</h1>
                <p>Update an existing inventory product.</p>
            </div>

            <div class="user-info">
                <strong>{{ username }}</strong>
                <span>{{ role }}</span>
            </div>

        </header>


        <section class="welcome-section">

            <h2>Edit Product</h2>

            <p>
                Enter the Product ID and the information you want to update.
            </p>

        </section>


        <section class="dashboard-section">

            <div class="section-card">

                <h2>Product Information</h2>

                <form method="POST" action="/products/update">

                    <div class="form-group">

                        <label for="product_id">
                            Product ID
                        </label>

                        <input
                            type="number"
                            id="product_id"
                            name="product_id"
                            min="1"
                            value="{{ product_id or '' }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="name">
                            New Product Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Leave blank to keep current name"
                        >

                    </div>


                    <div class="form-group">

                        <label for="price">
                            New Price
                        </label>

                        <input
                            type="number"
                            id="price"
                            name="price"
                            min="0"
                            step="0.01"
                            placeholder="Leave blank to keep current price"
                        >

                    </div>


                    <div class="form-group">

                        <label for="category">
                            New Category
                        </label>

                        <input
                            type="text"
                            id="category"
                            name="category"
                            placeholder="Leave blank to keep current category"
                        >

                    </div>


                    <div class="form-actions">

                        <button
                            type="submit"
                            class="btn-primary"
                        >
                            Update Product
                        </button>

                        <a
                            href="/products"
                            class="btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </section>

    </main>

</body>
</html>
